# value_growth_extended_validation — 2015-2025 OOS, 180d focus
#
# Label data now covers 2010-2025 (recomputed from 2010-01-04).
# 504d train window enables first OOS eval from ~2015.

experiment_id: value_growth_extended_validation
title: "Value Growth Extended Validation — 2015-2025 OOS"
description: >
  Extended OOS validation for value_growth_multibagger_v1_features.
  504d rolling window, 180d raw label.
  OOS from 2015 to 2025, eval every 20d.

calendar:
  start_date: "2013-01-01"
  end_date: "2025-12-31"
  train_window_days: 504
  step_days: 20

signal:
  signal_id: vgb_ext_signal
  score_column: score

feature_list_id: value_growth_multibagger_v1_features

generators:
  - generator_id: vgb_ext
    type: multi_label_lightgbm
    params:
      universe: csi800
      n_estimators: 300
      feature_list_id: value_growth_multibagger_v1_features
      labels:
        - label_id: fwd_ret_180d_raw

signal_transforms:
  - transform_id: daily_zscore
    type: daily_zscore

labels:
  - label_id: fwd_ret_180d_raw
