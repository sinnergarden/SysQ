# value_growth_multibagger_v2_features — v2 feature set for right-tail research
#
# Groups:
#   1. growth_quality (v1, 13 features): basic financial ratios + improvement deltas
#   2. valuation_repair (v1+v2, 14 features): PE/PB percentiles + repair room + PEG
#   3. continuation_trend_quality (v2, 15 features): RPS, trend smoothness, volatility-adj return
#   4. volume_participation_quality (v2, 6 features): volume up/down ratio, spike, stability
#   5. fundamental_acceleration (v2, 5 features): YoY acceleration, 756d deltas, OCF margin
#   6. market_confirmation (v1, 7 features): ret_20/60/120d, volume_ratio, distance_to_high
#   7. path_classifier_scores (v2, 4 features): composite scores
# Total: ~64 features
#
# PIT: $-prefixed fields safe via ann_date. Shifts/rolling backward-only.

feature_list_id: value_growth_multibagger_v2_features
description: "v2 feature set: continuation + repair path features (64 features total)"

features:
  # ═══════════════════════════════════════════════════════════════════
  # 1. growth_quality — v1
  # ═══════════════════════════════════════════════════════════════════
  - $roe
  - $grossprofit_margin
  - $debt_to_assets
  - $op_cashflow
  - operating_cf_to_profit
  - net_margin
  - roa
  - roe_delta_252d
  - grossprofit_margin_delta_252d
  - debt_to_assets_delta_252d
  - op_cashflow_delta_252d
  - revenue_yoy
  - profit_yoy

  # ═══════════════════════════════════════════════════════════════════
  # 2. valuation_repair — v1 + v2
  # ═══════════════════════════════════════════════════════════════════
