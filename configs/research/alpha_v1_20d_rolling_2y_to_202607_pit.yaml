# Modified AlphaV1 comparison requested by the PIT audit:
# - preserve the immutable historical 132-feature model input and LightGBM
#   hyperparameters;
# - intentionally train only the 20d target (no legacy 5d/20d blend);
# - enforce CSI800 PIT-v2 membership for training and prediction;
# - use a strict PIT label and restart-safe per-window checkpoints.
experiment_id: alpha_v1_20d_rolling_2y_to_202607_pit
calendar:
  start_date: "2021-01-01"
  end_date: "2026-07-31"
  train_window_days: 504
  step_days: 5
signal:
  signal_id: alpha_v1_historical132_20d_pit
  score_column: score
feature_list_id: alpha_v1_clean_132
source_manifest_hash: 780ba40ec5ce8a5f5b5c88b02e1e171e0d67c3c2b02639b22ed0a2b889abc237
window_checkpoints: true
generators:
  - generator_id: alpha_v1_historical132_20d_pit
    type: multi_label_lightgbm
    params:
      universe: csi800_pit_union
      n_estimators: 200
      feature_list_id: alpha_v1_clean_132
      pit_membership: true
      pit_universe_artifact: csi800_pit_v2
      lgb_params:
        objective: regression
        metric: mse
        colsample_bytree: 0.8879
        learning_rate: 0.0421
        subsample: 0.8789
        lambda_l1: 205.6999
        lambda_l2: 580.9768
        max_depth: 8
        num_leaves: 210
        num_threads: 8
        verbosity: -1
        seed: 42
      labels:
        - label_id: fwd_ret_20d_raw_pit
signal_transforms:
  - transform_id: daily_zscore
    type: daily_zscore
labels:
  - label_id: fwd_ret_20d_raw_pit
    label_maturity_lag_trading_days: 21
