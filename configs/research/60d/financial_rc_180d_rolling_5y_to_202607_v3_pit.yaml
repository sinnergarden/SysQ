# Stage 9B — full PIT P0 retrain (correctness audit, NOT strategy tuning).
# Baseline: financial_rc_180d_rolling_5y_to_202607_v3.yaml (static-800).
# Deliberate changes ONLY:
#   - experiment_id / signal_id / generator_id: distinct `_pit` ids so the
#     signal_run_id (rolling__{experiment_id}__...) cannot clobber the baseline.
#   - universe: csi800 -> csi800_pit_union (qlib registry, PIT union spans).
#   - +pit_membership: true  -> per-row filter to csi800_pit_v1 membership at
#     each row's feature date, applied once post-load so train and predict see
#     identical PIT rows (Section 17: PIT must apply to training, not just the
#     prediction universe).
#   - label: fwd_ret_180d_raw -> fwd_ret_180d_raw_pit (union label store).
# Frozen from baseline: calendar, train_window_days, step_days, feature_list_id,
# n_estimators, signal transform, label_maturity_lag.  Costs/T+1 frozen at the
# backtest step (not in this config).
experiment_id: financial_rc_180d_rolling_5y_to_202607_v3_pit
calendar:
  start_date: "2021-01-01"
  end_date: "2026-07-31"
  train_window_days: 504
  step_days: 20
signal:
  signal_id: v3a_growth_financial_180d_pit
  score_column: score
feature_list_id: v3a_plus_liquidity_financial_rc
generators:
  - generator_id: v3a_growth_financial_180d_pit
    type: multi_label_lightgbm
    params:
      universe: csi800_pit_union
      n_estimators: 300
      feature_list_id: v3a_plus_liquidity_financial_rc
      pit_membership: true
      labels:
        - label_id: fwd_ret_180d_raw_pit
signal_transforms:
  - transform_id: daily_zscore
    type: daily_zscore
labels:
  - label_id: fwd_ret_180d_raw_pit
    label_maturity_lag_trading_days: 181
