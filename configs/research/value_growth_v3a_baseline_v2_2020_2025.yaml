# v3a ablation baseline: v2 features, 2020-2025 period

experiment_id: v3a_ablation_baseline
title: "v3a ablation — v2 baseline (2020-2025)"
description: "Ablation baseline: standard v2 64 features, 2020-2025 rolling, 180d label."

calendar:
  start_date: "2020-01-01"
  end_date: "2025-12-31"
  train_window_days: 504
  step_days: 20

signal:
  signal_id: v3a_baseline
  score_column: score

feature_list_id: value_growth_multibagger_v2_features

generators:
  - generator_id: v3a_bl
    type: multi_label_lightgbm
    params:
      universe: csi800
      n_estimators: 300
      feature_list_id: value_growth_multibagger_v2_features
      labels:
        - label_id: fwd_ret_180d_raw

signal_transforms:
  - transform_id: daily_zscore
    type: daily_zscore

labels:
  - label_id: fwd_ret_180d_raw
