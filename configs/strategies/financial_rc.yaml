strategy_id: financial_rc
display_name: "60d/180d Financial Research Candidate"
stage: research
family: ml_ensemble
account_id: research_financial_rc
universe: csi800
feature_set: v3a_plus_liquidity_financial_rc
model_version: financial_rc_equal_weight_8f9f3fc18f422ebb
signal_version: blend_0.5_60d_0.5_180d_shareholder_pit_v5

# The model sees a single-date feature snapshot: margin and ordinary inputs
# are both from signal_date. Tushare margin_detail is only treated as complete
# on the following open session, so daily inference delays the entire snapshot
# by one open session instead of mixing T prices with T-1 margin data.
feature_availability:
  margin:
    source: tushare.margin_detail
    lag_sessions: 0

# Shareholder sidecars are announcement-driven PIT inputs.  Non-null values
# are not sufficient: a stopped updater leaves every row populated while the
# stale-day features drift far outside the training distribution.
feature_freshness:
  shareholder:
    source: tushare.stk_holdernumber+tushare.top10_holders
    availability_rule: announcement_date_asof
    min_coverage: 0.95
    features:
      holder_num_stale_days:
        max_median_days: 200
        max_row_days: 365
      top10_holder_stale_days:
        max_median_days: 250
        max_row_days: 365

hypothesis: >
  Equal-weight ensemble of pinned 60d and 180d financial_rc models for a
  ranked screening list that receives human fundamental review. Research
  candidate only — no automatic execution or portfolio construction.

# Canonical artifact-only inference. Model/scaler/metadata files are pinned by
# SHA-256; changing any artifact or blend weight requires a reviewed config diff.
inference:
  engine: pinned_model_blend_v1
  universe: csi800
  feature_list_id: v3a_plus_liquidity_financial_rc
  model_bundle:
    bundle_id: financial_rc_60d180d_equal_20260810_shareholder_pit_v5
    models:
      - tag: 60d
        model_hash: d239c448ba17e8ab
        artifact_id: e607edd00a7d6067
        model_dir: data/research/models/60d_v3a_growth_financial/e607edd00a7d6067
        label_id: fwd_ret_60d_raw
        horizon: 60
        weight: 0.5
        artifact_sha256:
          model.txt: d239c448ba17e8ab421729c1e3651190cf93e1ff497c3d07afaa176626af9b27
          center.json: a7a8082eb21408e2bb384e17cdc92d23e676ce1130c5f2c74f5924edad58b452
          scale.json: 35775296b5ddd8a3435c4238cbe228d34aec323675ae06a9f1c728eb358d3bd7
          meta.json: d358b6b53fdebe26c108a3f533f3baf07012dd426944dd3b3d3fc3c096479e71
      - tag: 180d
        model_hash: 429b3d9b93311e76
        artifact_id: eb8c0423e1ad7e8d
        model_dir: data/research/models/180d_v3a_growth_financial/eb8c0423e1ad7e8d
        label_id: fwd_ret_180d_raw
        horizon: 180
        weight: 0.5
        artifact_sha256:
          model.txt: 429b3d9b93311e76de91353d8cbf2ee32a9299905a9174463cfd273ed91791ff
          center.json: f8c2f68f89ef53365176d1441e9fe796d544da7de8ca34f21abaa1be8e3f2bda
          scale.json: 0ac505f53a7a3289d53301c47cf06959182f261c64b85fc8692dffb90eadcf34
          meta.json: 045ff5d58119aa85eea9150623c2f51abc76ae7d82303e7658fe469f8e862b3a
  score_transform: daily_cs_zscore_unclipped_ddof0
  top_k: 200
  min_universe_size: 500
  min_eligible_size: 450
  min_feature_coverage: 0.75
  min_global_feature_coverage: 0.75
  # Global coverage alone can hide a dead model input.  Any individual
  # feature above this missing ratio blocks the run, and any feature used by
  # a model split must have cross-sectional variation on the signal date.
  max_feature_missing_ratio: 0.95
  min_model_used_feature_unique_values: 2
  min_listed_days: 180
  min_amount: 0
  exclude_name_patterns: [ST, "退"]
  market_close_cutoff: "18:00"
  # Decision session T uses the fully aligned T-1 feature snapshot and emits
  # candidates for T+1. Explicit signal dates must match this exact boundary;
  # arbitrary historical inference remains forbidden with a current snapshot.
  feature_snapshot_lag_sessions: 1
  output_root: outputs
  # Current CSI800 constituents are safe for live screening but not a PIT
  # historical universe. Historical inference remains unavailable until a
  # dedicated PIT constituent provider is implemented.
  universe_snapshot_semantics: current_constituents_snapshot

# Migration rationale (2026-08): legacy scripts encoded two incompatible
# products. predict_financial_rc.py used 0.3/0.7 for a concentrated Top5
# trailing-stop workflow, while gen_candidate_top200.py used 0.5/0.5 for a
# broad human-review screen. This canonical use case is explicitly the latter,
# as requested by the operator. Equal weighting is an operating contract that
# avoids an unreviewed preference for either horizon; it is NOT evidence that
# 0.5/0.5 outperforms 0.3/0.7.  The operator has fixed this Top200 research
# workflow at 0.5/0.5; comparing legacy 0.3/0.7 is not a prerequisite for this
# screening artifact.  Automatic portfolio construction and promotion remain
# outside this use case.

# Canonical bundle training.  The operator supplies the research as-of session
# with --trade-date (or --train-end-date); the trainer derives the freshest 504
# feature sessions whose next-session labels both exist and are fully mature.
# It writes immutable content-addressed artifacts only and never mutates a
# shadow/prod promotion pointer.
training:
  engine: financial_rc_lightgbm_bundle_v1
  universe: csi800
  feature_list_id: v3a_plus_liquidity_financial_rc
  pointer_write_mode: none
  window_sessions: 504
  validation_sessions: 40
  n_estimators: 300
  min_feature_coverage: 0.50
  max_feature_missing_ratio: 0.995
  # Labels are also current-snapshot artifacts. A stale label store can still
  # contain 800 names while silently omitting newly added current members.
  min_label_universe_coverage: 0.99
  models:
    - tag: 60d
      experiment_id: 60d_v3a_growth_financial
      label_id: fwd_ret_60d_raw
      horizon: 60
    - tag: 180d
      experiment_id: 180d_v3a_growth_financial
      label_id: fwd_ret_180d_raw
      horizon: 180

lifecycle:
  created: 2026-06-28
  stage_history:
    - stage: research
      at: 2026-06-28

promotion_gates:
  backtest_verified: false
  contract_tests_pass: false
