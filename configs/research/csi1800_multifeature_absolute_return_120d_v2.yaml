experiment_id: csi1800_multifeature_absolute_return_120d_v2
title: Fixed multi-feature 120-session absolute-return experiment
description: Ridge primary and low-capacity LightGBM challenger on one frozen 97-feature PIT union; raw and same-day exposure-residualized scores are produced from identical rolling windows.
research_protocol:
  protocol_version: absolute_return_abcd_v1
  artifact_contract: rolling_checkpoint_model_diagnostics_v1
  require_checkpoint_model_diagnostics: true
  economic_hypothesis_count: 1
  horizon_sessions: 120
  development_period: {start_date: "2021-01-04", end_date: "2022-12-30"}
  confirmation_period: {start_date: "2023-01-03", end_date: "2024-12-31"}
  holdout:
    start_date: "2025-01-02"
    status: untouched
    unlock_rule: one terminal run only after model freeze, complete accounting, leakage checks, robustness gates, and independent audit have passed
  arms:
    A: csi800_buy_and_hold
    B: ridge_total_return_score_top20
    C: ridge_score_residualized_daily_against_fixed_pit_exposures_top20
    D: arm_C_with_fixed_market_risk_overlay_at_50_percent_exposure
  challenger: fixed_low_capacity_lightgbm_no_search
  portfolio:
    top_n: 20
    rebalance_sessions: 20
    initial_capital: 10000000
    commission: 0.0003
    stamp_duty: 0.001
    min_commission: 5.0
    slippage: 0.001
    max_participation_rate: 0.10
    liquidity_gate_mode: reject
    execution: previous_session_information_to_next_open
  primary_metrics:
    - net_cagr
    - max_drawdown
    - calmar
    - historical_cvar_95_daily
    - turnover_annualized
    - capm_beta
    - capm_alpha_annualized
  model_selection: no_hyperparameter_search_use_development_for_diagnostics_and_confirmation_for_fixed_comparison
  residual_exposures:
    size: Log($circ_mv+1)
    momentum: ret_60d
    volatility: Std(($close*$factor)/(Ref($close*$factor, 1)+1e-12)-1, 60)
    liquidity_participation: $amount/(Mean($amount, 60)+1e-12)
