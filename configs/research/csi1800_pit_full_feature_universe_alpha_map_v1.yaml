future_directions:
  - rank: 1
    direction: Complete rights-event sourcing and approve portfolio participation accounting, then rerun the existing Stage-C protocol unchanged.
    evidence: The confirmed candidate is held across an uncovered material factor discontinuity in all three portfolio sizes.
  - rank: 2
    direction: Test a fixed, low-capacity financial-quality blend with explicit orthogonalization against valuation, size, industry, and recent return exposures.
    evidence: The transparent linear model confirmed while the tree model did not, favoring constrained structure over added complexity.
  - rank: 3
    direction: Measure refresh cadence and decay for the confirmed 120-session financial-quality signal before any holdout use.
    evidence: Confirmation RankIC declined from 0.1063 in 2023 to 0.0248 in 2024.
  - rank: 4
    direction: Expand immutable first-publication coverage for the catalogued financial fields that remain data-blocked, then re-enter them through the same Stage-A gates.
    evidence: The full catalog identifies source-coverage gaps separately from rejected definitions.
  - rank: 5
    direction: Establish first-publication archives for shareholder disclosures and repeat lag sensitivity before promotion eligibility is considered.
    evidence: Shareholder features remain provisional by construction under the current PIT-X contract.
