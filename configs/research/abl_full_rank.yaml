experiment_id: v3a_fl_rank
calendar:
  start_date: "2020-01-01"
  end_date: "2025-12-31"
  train_window_days: 504
  step_days: 20
signal:
  signal_id: fl_rank
  score_column: score
feature_list_id: value_growth_multibagger_v3a_features
generators:
  - generator_id: fl_rank
    type: multi_label_lightgbm
    params:
      universe: csi800
      n_estimators: 300
      feature_list_id: value_growth_multibagger_v3a_features
      lgb_params:
        objective: lambdarank
        label_gain: "0,1,2,3,4"
        num_leaves: 63
        learning_rate: 0.05
        min_data_in_leaf: 50
      labels:
        - label_id: fwd_ret_180d_raw
signal_transforms:
  - transform_id: daily_zscore
    type: daily_zscore
labels:
  - label_id: fwd_ret_180d_raw
