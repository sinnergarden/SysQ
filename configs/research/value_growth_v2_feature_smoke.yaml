experiment_id: value_growth_v2_feature_smoke
title: Value Growth v2 Feature Smoke — 2023-2025
description: 'Smoke test for value_growth_multibagger_v2_features (v1+v2). Compare
  against v1 baseline (value_growth_multibagger_v1_features). 504d rolling window,
  180d raw label. Period 2023-01-01 to 2025-12-31, eval every 20d.

  '
calendar:
  start_date: '2023-01-01'
  end_date: '2025-12-31'
  train_window_days: 504
  step_days: 20
signal:
  signal_id: v2_smoke_signal
  score_column: score
feature_list_id: value_growth_multibagger_v2_features
generators:
- generator_id: v2_smoke
  type: multi_label_lightgbm
  params:
    universe: csi800
    n_estimators: 300
    feature_list_id: value_growth_multibagger_v2_features
    labels:
    - label_id: fwd_ret_180d_raw
signal_transforms:
- transform_id: daily_zscore
  type: daily_zscore
labels:
- label_id: fwd_ret_180d_raw
  label_maturity_lag_trading_days: 181
