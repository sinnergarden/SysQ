experiment_id: value_growth_multibagger_v1
title: Value Growth Multibagger — Long-horizon right-tail return research
description: 'Research baseline for A-share medium-to-long cycle right-tail candidate
  discovery. Single-task LightGBM per horizon on raw forward returns (60d/120d/180d).
  Uses value_growth_multibagger_v1_features (3-group: growth_quality, valuation_repair,
  market_confirmation). No fundamental as-of audit yet — see PR description gaps.

  '
calendar:
  start_date: '2024-06-01'
  end_date: '2025-12-31'
  train_window_days: 504
  step_days: 20
signal:
  signal_id: vgb_multibagger_signal
  score_column: score
feature_list_id: value_growth_multibagger_v1_features
generators:
- generator_id: vgb_multibagger
  type: multi_label_lightgbm
  params:
    universe: csi800
    n_estimators: 300
    feature_list_id: value_growth_multibagger_v1_features
    labels:
    - label_id: fwd_ret_60d_raw
    - label_id: fwd_ret_120d_raw
    - label_id: fwd_ret_180d_raw
signal_transforms:
- transform_id: daily_zscore
  type: daily_zscore
labels:
- label_id: fwd_ret_60d_raw
  label_maturity_lag_trading_days: 181
- label_id: fwd_ret_120d_raw
  label_maturity_lag_trading_days: 181
- label_id: fwd_ret_180d_raw
  label_maturity_lag_trading_days: 181
