# Harness Map — SysQ v0.1
# Maps use cases to entrypoints, artifacts, checks, and owner agents.
# Used by harness checks and multi-agent routing.
# Every UC must have a 'domain' field matching docs/requirements/domains/{domain}.md.

usecases:
  UC_DAILY_OPS:
    domain: daily_ops
    status: stable
    owner_agent: operator_agent
    skills:
      primary: sysq-daily
    entrypoints:
      - scripts/data_sync.py
      - scripts/run_daily.py
      - scripts/run_daily_batch.py
      - scripts/ops/sync_csi800_daily.py
    artifacts:
      - daily/{trade_date}/pre_open/signals/
      - daily/{trade_date}/post_close/
      - runs/{trade_date}/{run_id}/
      - data/trade.db
      - data/canonical/daily/
    checks:
      - harness/checks/check_model_resolution_boundary.py
      - harness/checks/check_no_latest_model_resolution.py
      - harness/checks/check_daily_inference_ready.py
      - harness/checks/check_shareholder_data_freshness.py
      - tests/test_source_audit.py
      - tests/test_data_sync_csi1800.py
      - tests/test_financial_replay.py
      - tests/test_daily_incremental_fastpath.py
      - tests/ops/test_universe_history.py
    allowed_paths:
      - scripts/data_sync.py
      - scripts/run_daily.py
      - scripts/run_daily_batch.py
      - scripts/ops/sync_csi800_daily.py
      - qsys/config/manager.py
      - qsys/data/collector.py
      - qsys/data/_merge_helpers.py
      - qsys/data/adapter.py
      - qsys/data/income_sidecar.py
      - qsys/data/storage.py
      - qsys/data/source_audit.py
      - qsys/ops/
      - configs/strategies/
      - harness/checks/
      - docs/requirements/contracts/tushare_daily.yaml
      - docs/CONTRACTS.md
      - docs/ops/DAILY_OPS_SOP.md
      - tests/
    forbidden_paths:
      - qsys/ledger/
      - qsys/backtest/
      - qsys/trader/
      - qsys/broker/
  UC_DAILY_RUNTIME_DEPLOYMENT:
    domain: runtime_deployment
    status: draft
    owner_agent: operator_agent
    skills:
      primary: sysq-dev
      review: sysq-review
    entrypoints:
      - scripts/deploy_csi1800_pit_runtime.py
    artifacts:
      - detached runtime checkout pinned to an explicit commit revision
      - installed qsys-csi1800-pit-daily-sync.service and timer bytes
      - stdout and preflight verification result
    checks:
      - harness/checks/check_usecase_registry.py
      - harness/checks/check_agent_docs.py
      - tests/test_deploy_systemd.py
    allowed_paths:
      - scripts/deploy_csi1800_pit_runtime.py
      - deploy/
      - tests/test_deploy_systemd.py
      - AGENTS.md
      - docs/requirements/
      - .claude/skills/sysq-dev/SKILL.md
    forbidden_paths:
      - scripts/data_sync.py
      - scripts/ops/sync_csi800_daily.py
      - scripts/run_daily.py
      - scripts/run_daily_batch.py
      - qsys/data/
      - qsys/signal/
      - qsys/model/
      - qsys/feature/
      - qsys/backtest/
      - qsys/broker/
      - qsys/trader/
      - qsys/ledger/
      - qsys/ops/
      - data/
      - outputs/
  UC_DAILY_INFERENCE_RUN:
    domain: daily_ops
    status: stable
    owner_agent: operator_agent
    skills:
      primary: sysq-daily
      review: sysq-review
    entrypoints:
      - scripts/run_daily.py --mode infer
    artifacts:
      - outputs/{signal_date}/{strategy_id}/{run_id}/candidate_run.json
      - data/research/signals/{signal_id}/{signal_run_id}/
    checks:
      - harness/checks/check_daily_inference_ready.py
      - harness/checks/check_inference_artifact.py
      - harness/checks/check_shareholder_data_freshness.py
    allowed_paths:
      - scripts/run_daily.py
      - configs/strategies/
      - outputs/
      - data/research/signals/
      - data/research/models/
      - qsys/signal/
      - qsys/data/adapter.py
      - qsys/data/income_sidecar.py
      - qsys/feature/
      - qsys/ops/shareholder_sync.py
      - qsys/ops/inference_readiness.py
      - scripts/dev/
      - harness/checks/
      - docs/requirements/
      - .claude/skills/
      - tests/
    forbidden_paths:
      - qsys/broker/
      - qsys/trader/
      - qsys/ledger/
      - deploy/
      - qsys/ops/daily_runner.py

  UC_TOP10_SIGNAL_RUN:
