# value_growth_v2_extended_validation — 2013-2025 full period
# V2 feature set (64 features), 180d raw label.

experiment_id: value_growth_v2_extended_validation
title: "Value Growth v2 Extended Validation — 2013-2025"
description: "Full-period validation for v2 features. 504d rolling, 180d label."

calendar:
  start_date: "2013-01-01"
  end_date: "2025-12-31"
  train_window_days: 504
  step_days: 20

signal:
  signal_id: v2_ext_signal
  score_column: score

feature_list_id: value_growth_multibagger_v2_features

generators:
  - generator_id: v2_ext
    type: multi_label_lightgbm
    params:
      universe: csi800
      n_estimators: 300
      feature_list_id: value_growth_multibagger_v2_features
      labels:
        - label_id: fwd_ret_180d_raw

signal_transforms:
  - transform_id: daily_zscore
    type: daily_zscore

labels:
  - label_id: fwd_ret_180d_raw
