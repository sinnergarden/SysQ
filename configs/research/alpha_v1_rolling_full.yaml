experiment_id: alpha_v1_rolling_full_2024_2026
title: "alpha_v1 LightGBM rolling (full 2024-2026)"
description: >
  Rolling research using pre-trained alpha_v1 LightGBM model.
  Inference-only per window (no re-training).

calendar:
  start_date: "2024-01-01"
  end_date: "2026-05-22"
  train_window_days: 252
  step_days: 5

signal:
  signal_id: alpha_v1_existing_score
  score_column: score

generators:
  - generator_id: alpha_v1
    type: alpha_v1_existing
    params: {}

signal_transforms:
  - transform_id: daily_zscore
    type: daily_zscore
  - transform_id: raw
    type: identity

strategies:
  - strategy_id: top20
    strategy_template_id: rank_weight_top20
    allocation_method: rank_weight
    top_n: 20
    initial_capital: 10000000
    rebalance_freq: weekly
    artifact_mode: summary

labels:
  - label_id: fwd_ret_5d_xsz_clip3
  - label_id: fwd_ret_20d_xsz_clip3
